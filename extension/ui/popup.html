<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoDati · 工作台</title><link rel="stylesheet" href="../common/theme.css"><link rel="stylesheet" href="popup.css"></head>
<body class="dati-root" data-theme="dark">
<div class="pop">
  <header class="pop-head">
    <span class="pop-head__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h10M5 11h7M5 16h4m5-1 3 3 5-7"/></svg></span>
    <div class="pop-head__text"><strong>AutoDati<span class="pop-head__edition">工作台</span></strong><span>让专注，留给每一道题。</span></div>
    <span class="dati-badge" id="connBadge">连接中</span>
  </header>
  <section class="pop-master" id="masterCard">
    <label class="pop-master__row"><div class="pop-master__text"><strong class="pop-master__title" id="masterTitle">已启用</strong><span class="pop-master__desc" id="masterDesc">识别题目，随时待命</span></div><span class="dati-switch dati-switch--lg"><input type="checkbox" id="swMaster" aria-label="启用 AutoDati"></span></label>
  </section>
  <div class="pop-body" id="popBody">
    <section class="pop-state">
      <div class="pop-state__head"><span class="pop-section-label">当前页面</span><button class="pop-link" type="button" id="btnRefreshState" title="刷新状态" aria-label="刷新页面状态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 1 1 2 7M4 4v7h7"/></svg></button></div>
      <div class="pop-state__body" id="stateBody"><div class="pop-state__text"><span class="pop-state__title" id="stateTitle">正在连接页面</span><span class="pop-state__sub" id="stateSub">读取当前页面的题目状态</span><div class="pop-state__signal"><span class="pop-state__dot is-idle" id="stateDot"></span><span>页面识别</span></div></div><div class="pop-state__metric"><strong id="stateCount">0</strong><span>道题目</span></div></div>
    </section>
    <div class="pop-actions"><button class="dati-btn dati-btn--primary pop-action" type="button" id="btnScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m13-5v4a1 1 0 0 1-1 1h-4M7 12h10"/></svg>立即扫描<span class="pop-action__arrow" aria-hidden="true">↗</span></button><button class="dati-btn pop-action" type="button" id="btnCapture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="15" rx="3"/><path d="m8 6 2-3h4l2 3"/><circle cx="12" cy="13" r="3"/></svg>截图搜题</button></div>
    <section class="pop-mode-section"><div class="pop-section-heading"><span class="pop-section-label">自动化流程</span></div><div class="pop-modes"><label class="pop-mode" id="modePopup"><span aria-hidden="true" class="pop-mode__icon"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><rect height="16" rx="3" width="18" x="3" y="4"></rect><path d="M3 9h18m-13 5h8"></path></svg></span><span class="pop-mode__text"><span class="pop-mode__name">自动弹窗</span><span class="pop-mode__desc">先看答案，再确认填入</span></span><span class="dati-switch"><input aria-label="开启辅助面板" id="swPopup" type="checkbox"/></span></label><label class="pop-mode" id="modeAuto"><span aria-hidden="true" class="pop-mode__icon"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="m13 3-8 11h6l-1 7 9-12h-6l1-6Z"></path></svg></span><span class="pop-mode__text"><span class="pop-mode__name">自动答题</span><span class="pop-mode__desc">识别完成后自动填入</span></span><span class="dati-switch"><input aria-label="开启自动作答" id="swAuto" type="checkbox"/></span></label><label class="pop-mode" id="modeAutoNextPage"><span aria-hidden="true" class="pop-mode__icon"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></span><span class="pop-mode__text"><span class="pop-mode__name">自动点击下一页</span><span class="pop-mode__desc">按命中规则的按钮配置翻页</span></span><span class="dati-switch"><input aria-label="自动点击下一页" id="swAutoNextPage" type="checkbox"/></span></label></div><details class="pop-feedback"><summary>页面反馈</summary><label class="pop-badge-toggle"><span>显示题目角标</span><span class="dati-switch"><input aria-label="显示题目角标" id="swHoverHint" type="checkbox"/></span></label><label class="pop-badge-toggle" style="margin-top:10px;justify-content:space-between;width:100%"><span>自动翻页点击高亮</span><span class="dati-switch"><input aria-label="自动翻页点击高亮" id="swHighlightNextPage" type="checkbox"/></span></label></details></section>
    <button class="pop-model" id="btnSwitchModel" type="button" title="打开模型设置"><span class="pop-model__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></span><span class="pop-model__body"><span class="pop-model__name" id="modelName">未选择模型</span><span class="pop-model__meta"><span id="modelProvider">默认配置</span><span class="pop-model__divider">·</span><span id="modelFormat">OpenAI 兼容</span></span></span><span class="pop-model__state" id="modelState">待配置</span><span class="pop-model__arrow" aria-hidden="true">›</span></button>
    <button class="pop-template" type="button" id="btnPickTemplate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><rect x="8" y="8" width="8" height="8" rx="2"/></svg><span>打开预设编辑器</span><span aria-hidden="true">＋</span></button>
<p id="navigationStatus" class="pop-hint" role="status"></p><section class="pop-updates"><span data-update-status role="status" aria-live="polite">正在读取版本…</span><div><button type="button" class="pop-link" data-update-check>检查更新</button><button type="button" class="pop-link" data-update-open>GitHub Releases ↗</button></div></section>
    <div class="pop-hint" id="popHint"></div>
  </div>
  <footer class="pop-foot"><button class="pop-foot__btn" type="button" id="btnOptions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--dati-bg-elev)"/><circle cx="15" cy="17" r="3" fill="var(--dati-bg-elev)"/></svg>完整设置<span aria-hidden="true">↗</span></button><span class="pop-foot__ver" id="popVersion">v0.1.0</span></footer>
</div><div class="dati-toast" id="toast" role="status" aria-live="polite"></div>
<script src="../common/protocol.js"></script><script src="../common/settings.js"></script><script src="popup.js"></script><script src="updates.js"></script>
</body></html>
